name: Build and deploy personal site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JavaScript files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}"
        env:
          JEKYLL_ENV: production

      - name: Add GitHub Pages marker
        run: touch _site/.nojekyll

      - name: Publish build to gh-pages branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          rm -rf deploy
          git worktree add -B gh-pages deploy origin/gh-pages

          find deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. deploy/

          cd deploy
          git add -A

          if git diff --cached --quiet; then
            echo "No built-site changes to publish."
          else
            git commit -m "Deploy site from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
